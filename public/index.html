<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cauciones Checker</title>
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="background-orbs">
      <div class="orb orb-1"></div>
      <div class="orb orb-2"></div>
      <div class="orb orb-3"></div>
    </div>

    <main class="container">
      <header>
        <h1>Cauciones <span class="highlight">Corto Plazo</span></h1>
        <p>Monitoreo en vivo de rendimientos en cauciones</p>
        <div class="actions-container">
          <div id="umbral-text" class="umbral-info"></div>
          <a href="https://t.me/tu_grupo_aqui" target="_blank" class="telegram-btn">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
              <path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.894 8.221l-1.97 9.28c-.145.658-.537.818-1.084.508l-3-2.21-1.446 1.394c-.14.18-.357.223-.548.223l.188-2.85 5.18-4.686c.223-.195-.054-.296-.346-.105L7.24 14.39l-2.76-.867c-.602-.19-.611-.602.126-.89l10.81-4.168c.5-.185.94.116.784.867z"/>
            </svg>
            Unirse a Notificaciones en Telegram
          </a>
        </div>
      </header>

      <div id="loader" class="loader">
        <div class="spinner"></div>
        <p>Obteniendo datos del mercado...</p>
      </div>

      <div id="cauciones-grid" class="grid hidden">
        <!-- Las tarjetas se insertarán aquí dinámicamente -->
      </div>

      <footer>
        <p>Actualización automática cada 60 segundos</p>
        <p id="last-update" class="last-update">
          Última actualización: --:--:--
        </p>
      </footer>
    </main>

    <script src="app.js"></script>
  </body>
</html>
